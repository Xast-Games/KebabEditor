name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fonts, textures and icons are stored in Git LFS; without them the UI tests read LFS pointer files.
      # Only the editor's files are fetched, not the reports in docs/, to save LFS bandwidth.
      - name: Fetch LFS assets of the app
        run: git lfs pull --include="editor/**"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The Swing UI tests (Outliner, Asset Explorer) need a display: run them on a virtual X server.
      - name: Build and run tests
        run: xvfb-run --auto-servernum ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: editor/build/reports/tests/
