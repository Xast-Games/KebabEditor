# The "Intellij (Mini DE)" theme, after https://github.com/konceptosociala/mini-de (variant "intellij").
# Loaded on top of FlatDarkLaf.properties. Keys: https://www.formdev.com/flatlaf/customizing/

#---- palette (variants/intellij.conf) ----

@bg = #2b2d30
@bgInactive = #1e1f22
@surface = #1e1f22
@border = #4f5156
@raised = #393b40
@hilite = #2e436e
@accent = #3574f0
@accentText = #6a9bfa
@red = #db5c5c
@yellow = #d6ae58
@green = #5fad65

# The foreground mixed into the background, the way mini-de's GTK theme shades its controls
@mix05 = mix(@foreground,@bg,5%)
@mix10 = mix(@foreground,@bg,10%)
@mix15 = mix(@foreground,@bg,15%)
@mix30 = mix(@foreground,@bg,30%)

#---- FlatLaf variables ----

@background = @bg
@foreground = #dfe1e5
@disabledForeground = #85878c
@componentBackground = @surface
@buttonBackground = @mix10
@menuBackground = @bg

@accentColor = null
@accentBaseColor = @accent
@accentBase2Color = @accent
@accentFocusColor = @accent
@accentLinkColor = @accentText
@accentSelectionBackground = @hilite
@accentButtonDefaultBackground = @accent

@selectionBackground = @hilite
@selectionForeground = @foreground
@selectionInactiveBackground = @raised
@menuHoverBackground = @mix10
@icon = #9ea0a8

#---- shared ----

Component.arc = 18
Component.borderColor = @raised
Component.disabledBorderColor = @raised
Component.focusWidth = 0
Component.innerFocusWidth = 1
Component.focusColor = @accent
Component.focusedBorderColor = @accent
Component.linkColor = @accentText
Component.accentColor = @accent
Component.error.borderColor = @red
Component.error.focusedBorderColor = @red
Component.warning.borderColor = @yellow
Component.warning.focusedBorderColor = @yellow
Component.success.borderColor = @green
Component.success.focusedBorderColor = @green
Separator.foreground = @raised

Actions.Red = @red
Actions.Yellow = @yellow
Actions.Green = @green
Actions.Blue = @accentText

#---- buttons: flat, borderless, shaded by state ----

Button.arc = 18
Button.margin = 4,12,4,12
Button.background = @mix10
Button.hoverBackground = @mix15
Button.pressedBackground = @mix30
Button.selectedBackground = @mix30
Button.disabledBackground = @mix05
Button.borderColor = #0000
Button.hoverBorderColor = #0000
Button.disabledBorderColor = #0000
Button.focusedBorderColor = @accent
Button.innerFocusWidth = 1

Button.default.background = @accent
Button.default.foreground = #fff
Button.default.hoverBackground = mix(#fff,@accent,10%)
Button.default.pressedBackground = mix(#fff,@accent,25%)
Button.default.borderColor = #0000
Button.default.hoverBorderColor = #0000
Button.default.focusedBorderColor = @accentText
Button.default.focusColor = @accentText
Button.default.boldText = false

Button.toolbar.margin = 4,6,4,6
Button.toolbar.hoverBackground = @mix10
Button.toolbar.pressedBackground = @mix30
Button.toolbar.selectedBackground = @mix15

# The buttons beside the menu bar
[style]Button.menuButton = \
	background: #0000; \
	hoverBackground: @mix10; \
	pressedBackground: @mix30; \
	borderColor: #0000
MenuButton.playColor = @green
MenuButton.stopColor = @red

ToggleButton.background = @mix10
ToggleButton.selectedBackground = @mix15
ToggleButton.hoverBackground = @mix15
ToggleButton.pressedBackground = @mix30
ToggleButton.toolbar.selectedBackground = @mix15

#---- fields: filled, the border appears with focus ----

TextComponent.arc = 18
TextField.background = @mix10
FormattedTextField.background = @mix10
PasswordField.background = @mix10
TextField.disabledBackground = @mix05
FormattedTextField.disabledBackground = @mix05

ComboBox.background = @mix10
ComboBox.buttonBackground = @mix10
ComboBox.buttonEditableBackground = @mix10
ComboBox.disabledBackground = @mix05
ComboBox.popupBackground = @bg
ComboBox.buttonStyle = none
ComboBox.selectionArc = 12
ComboBox.selectionInsets = 1,4,1,4

Spinner.background = @mix10
Spinner.buttonBackground = @mix10
Spinner.disabledBackground = @mix05
Spinner.buttonStyle = none
Spinner.buttonSeparatorWidth = 0

#---- check boxes, sliders, progress ----

CheckBox.arc = 8
CheckBox.icon.style = filled
RadioButton.icon.style = filled
CheckBox.icon.background = @mix10
CheckBox.icon.borderColor = @border
CheckBox.icon.hoverBorderColor = @accentText
CheckBox.icon.focusedBorderColor = @accent
CheckBox.icon[filled].selectedBackground = @accent
CheckBox.icon[filled].selectedBorderColor = @accent
CheckBox.icon[filled].checkmarkColor = #fff

Slider.trackWidth = 4
Slider.thumbSize = 16,16
Slider.thumbColor = #d4d5d8
Slider.hoverThumbColor = #fff
Slider.pressedThumbColor = #fff
Slider.trackValueColor = @accent
Slider.trackColor = @raised

ProgressBar.arc = 6
ProgressBar.foreground = @accent
ProgressBar.background = @raised

#---- lists, trees, tables ----

List.selectionArc = 12
List.selectionInsets = 1,4,1,4
List.cellMargins = 2,10,2,10
Tree.selectionArc = 12
Tree.selectionInsets = 0,4,0,4
Tree.background = @surface
Table.background = @surface
Table.gridColor = @raised
TableHeader.background = @bg
TableHeader.separatorColor = @raised
TableHeader.bottomSeparatorColor = @raised

ScrollPane.arc = 0
ScrollBar.track = @surface
ScrollBar.thumb = #4f5156
ScrollBar.hoverTrackColor = @surface
ScrollBar.hoverThumbColor = #6f737a
ScrollBar.pressedThumbColor = #868a91

#---- tabs and split panes ----

TabbedPane.background = @bg
TabbedPane.underlineColor = @accent
TabbedPane.inactiveUnderlineColor = @border
TabbedPane.hoverColor = @mix05
TabbedPane.focusColor = @bg
TabbedPane.contentAreaColor = @raised
TabbedPane.tabSeparatorColor = @raised

SplitPaneDivider.style = plain
SplitPaneDivider.hoverColor = @mix10
SplitPaneDivider.draggingColor = @accent

#---- menus and popups ----

MenuBar.hoverBackground = @mix10
MenuBar.selectionBackground = @mix15
MenuBar.selectionForeground = @foreground
MenuBar.selectionArc = 12
MenuBar.selectionInsets = 2,0,2,0
MenuBar.selectionEmbeddedInsets = 8,0,8,0
MenuBar.borderColor = @raised
MenuItem.selectionBackground = @hilite
MenuItem.selectionForeground = @foreground
MenuItem.selectionArc = 12
MenuItem.selectionInsets = 0,5,0,5
MenuItem.acceleratorForeground = #9ea0a8
MenuItem.acceleratorSelectionForeground = @foreground
Popup.borderCornerRadius = 10
PopupMenu.borderColor = @border
PopupMenu.borderCornerRadius = 10
ToolTip.background = @raised
ToolTip.borderCornerRadius = 6

#---- title bar: round window buttons 16 px across, 29 px apart ----

# Off, or the title bar would not darken with an inactive window
TitlePane.unifiedBackground = false
TitlePane.background = @bg
TitlePane.inactiveBackground = @bgInactive
TitlePane.foreground = @foreground
TitlePane.embeddedForeground = @foreground
TitlePane.inactiveForeground = #9ea0a8
TitlePane.borderColor = @surface
TitlePane.buttonSize = 29,30
# FlatLaf adds its own gap on Linux
TitlePane.buttonsGap = 0
TitlePane.buttonsMargins = 0,8,0,7
TitlePane.buttonsFillVertically = true
TitlePane.buttonBackground = null
TitlePane.closeIcon = org.xast.kebab.ui.theme.RoundWindowIcon, close
TitlePane.iconifyIcon = org.xast.kebab.ui.theme.RoundWindowIcon, iconify
TitlePane.maximizeIcon = org.xast.kebab.ui.theme.RoundWindowIcon, maximize
TitlePane.restoreIcon = org.xast.kebab.ui.theme.RoundWindowIcon, maximize

TitlePane.round.close.background = #db5c5c
TitlePane.round.close.hoverBackground = #ee7676
TitlePane.round.close.pressedBackground = #b94a4a
TitlePane.round.maximize.background = #d6ae58
TitlePane.round.maximize.hoverBackground = #f2c55c
TitlePane.round.maximize.pressedBackground = #ba9752
TitlePane.round.iconify.background = #5fad65
TitlePane.round.iconify.hoverBackground = #7cc482
TitlePane.round.iconify.pressedBackground = #4a8a50
TitlePane.round.inactiveBackground = #4f5156
TitlePane.round.symbolColor = #1d2021

RootPane.activeBorderColor = @border
RootPane.inactiveBorderColor = @raised
